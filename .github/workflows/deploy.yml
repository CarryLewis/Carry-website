name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout ECG-stimulator
        uses: actions/checkout@v4
        with:
          repository: CarryLewis/ECG-stimulator
          path: .ecg-stimulator

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Build ECG stimulator
        working-directory: .ecg-stimulator
        run: |
          npm ci
          npm run build

      - name: Embed ECG build into public/
        run: |
          rm -rf public/ecg-simulator
          mkdir -p public/ecg-simulator
          cp -R .ecg-stimulator/dist/. public/ecg-simulator/

      - name: Build website
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
