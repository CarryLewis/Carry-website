name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by CarryLewis/ECG-stimulator when its embed tip is updated
  # (see docs/templates/ecg-notify-website.yml).
  # research-brief-updated: CarryLewis/research_brief talk HTML changed.
  # html-design-lab-updated: CarryLewis/HTML-Design-Lab shell changed
  # (see docs/templates/html-design-lab-notify-website.yml).
  repository_dispatch:
    types: [ecg-updated, research-brief-updated, html-design-lab-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Resolve ECG embed ref
        id: ecg
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          # shellcheck disable=SC1091
          source ecg-embed.ref
          # Always embed the pinned tip. repository_dispatch is only a
          # rebuild signal — do not follow payload.ref (ECG main may lag
          # behind feature tips after reverts).
          REF="$ECG_REF"
          if [[ -n "${PAYLOAD_REF:-}" && "$PAYLOAD_REF" != "$ECG_REF" ]]; then
            echo "Ignoring dispatch ref '$PAYLOAD_REF'; embedding pinned '$ECG_REF'"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using ECG-stimulator ref: ${REF}"

      - name: Checkout ECG-stimulator
        uses: actions/checkout@v4
        with:
          repository: CarryLewis/ECG-stimulator
          ref: ${{ steps.ecg.outputs.ref }}
          path: .ecg-stimulator

      - name: Resolve research_brief embed ref
        id: brief
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          # shellcheck disable=SC1091
          source research-brief-embed.ref
          REF="$RESEARCH_BRIEF_REF"
          if [[ "${PAYLOAD_SOURCE:-}" == "research-brief" && -n "${PAYLOAD_REF:-}" ]]; then
            REF="$PAYLOAD_REF"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using research_brief ref: ${REF}"

      - name: Checkout research_brief
        uses: actions/checkout@v4
        with:
          repository: CarryLewis/research_brief
          ref: ${{ steps.brief.outputs.ref }}
          path: .research-brief

      - name: Resolve HTML Design Lab embed ref
        id: lab
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          # shellcheck disable=SC1091
          source html-design-lab-embed.ref
          REF="$HTML_DESIGN_LAB_REF"
          if [[ "${PAYLOAD_SOURCE:-}" == "html-design-lab" && -n "${PAYLOAD_REF:-}" ]]; then
            REF="$PAYLOAD_REF"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using HTML-Design-Lab ref: ${REF}"

      - name: Checkout HTML-Design-Lab
        uses: actions/checkout@v4
        with:
          repository: CarryLewis/HTML-Design-Lab
          ref: ${{ steps.lab.outputs.ref }}
          path: .html-design-lab

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Build ECG stimulator
        working-directory: .ecg-stimulator
        run: |
          npm ci
          npm run build

      - name: Embed ECG build into public/
        run: |
          rm -rf public/ecg-simulator
          mkdir -p public/ecg-simulator
          cp -R .ecg-stimulator/dist/. public/ecg-simulator/

      - name: Embed research_brief HTML
        run: |
          HOME_SRC=".research-brief/frontend"
          if [[ -f "$HOME_SRC/index.html" ]]; then
            rm -rf public/research-brief
            mkdir -p public/research-brief
            cp -R "$HOME_SRC/." public/research-brief/
          elif [[ -f public/research-brief/index.html ]]; then
            echo "frontend/ missing in research_brief checkout; keeping vendored homepage"
          else
            echo "::error::Missing frontend/index.html and no vendored copy"
            exit 1
          fi

          # Thinking Vault talk is unpublished until a later HTML replaces it.
          rm -rf public/talks/thinking-vault

      - name: Embed HTML Design Lab shell
        run: |
          LAB_SRC=".html-design-lab"
          if [[ -d "$LAB_SRC/experiments" ]]; then
            rm -rf public/html-design-lab
            mkdir -p public/html-design-lab
            tar -C "$LAB_SRC" --exclude='.git' --exclude='.cursor' --exclude='.gitignore' --exclude='.github' -cf - . \
              | tar -C public/html-design-lab -xf -
          elif [[ -d public/html-design-lab/experiments ]]; then
            echo "experiments/ missing in HTML-Design-Lab checkout; keeping vendored copy"
          else
            echo "::error::Missing HTML-Design-Lab experiments and no vendored copy"
            exit 1
          fi

      - name: Build website
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
