name: Deploy feedback worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: Set inbox token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOX_TOKEN: ${{ secrets.FEEDBACK_INBOX_TOKEN }}
        run: |
          if [[ -z "${INBOX_TOKEN}" ]]; then
            echo "FEEDBACK_INBOX_TOKEN not set; skip secret put"
            exit 0
          fi
          printf '%s' "$INBOX_TOKEN" | npx wrangler@4 secret put INBOX_TOKEN
