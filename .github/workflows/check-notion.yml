name: Check Notion CMS without deployment
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:notion
      - run: npm run build
        env:
          NOTION_SYNC_ENABLED: 'false'
      - run: node scripts/verify-notion-export.mjs
